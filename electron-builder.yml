appId: com.cleandub.app
productName: CleanDub
directories:
  output: dist
  buildResources: build
asar: true
# 瘦身 v1.0.1：只保留中英文 locale，剔除其余 ~40 种语言资源
electronLanguages:
  - zh-CN
  - en-US
# 瘦身 v1.0.1：LZMA solid 最大压缩（顶层 compression 对 NSIS 生效；nsis 节点无此选项）
compression: maximum
files:
  - electron/**
  # 打包瘦身 v1.0.1：测试与文档文件不进安装包
  - "!electron/smoke*.test.js"
  - "!electron/boot-test.js"
  - "!electron/README.md"
  - dist-renderer/**
  - package.json
  # 瘦身 v1.0.2：剔除 lucide-react 运行时不需要的产物（cjs/esm/类型）—— 渲染层构建产物已在 dist-renderer
  # 以及 better-sqlite3 的构建期依赖（node-abi/tar-fs/rc/readable-stream/prebuild-install 等）
  # 和原生模块的 deps/ 源码目录
  - "!node_modules/lucide-react/dist"
  - "!node_modules/lucide-react/src"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.md"
  - "!node_modules/**/deps/**"
  - "!node_modules/**/src/**"
  - "!node_modules/**/Examples/**"
  - "!node_modules/**/.bin/**"
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: CleanDub
