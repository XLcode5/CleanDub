[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
# v1.2.0 引擎依赖（Phase 2）
sha2 = "0.10"        # SHA-256 流式哈希
thiserror = "2"       # CleanError 错误定义
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite（schema 与 v1.0.x 兼容）
chrono = "0.4"        # 隔离区本地时间戳（isoNow 语义）
