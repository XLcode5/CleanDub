<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title>CleanDub UI Preview — WinForms 模拟</title>
<style>
/* ===== CSS Variables (mirror C# static class C) ===== */
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --card: #1c2128;
  --border: #30363d;
  --hover: #242931;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --success: #3fb950;
  --warning: #d29922;
  --danger: #f85149;
  --danger-hover: #ff7b72;
  --radius: 12px;
  --radius-sm: 8px;
  --font: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}

[data-theme="light"] {
  --bg: #fff;
  --surface: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --hover: #f0f2f5;
  --text: #1f2328;
  --text2: #656d76;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --danger: #cf222e;
  --danger-hover: #a40e26;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  transition: background .3s;
}

/* ===== App Window Frame ===== */
.app-window {
  width: 1100px;
  height: 740px;
  background: var(--bg);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  box-shadow: 0 0 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
  transition: background .3s;
  resize: both;
  min-width: 900px;
  min-height: 600px;
}

/* ===== Title Bar ===== */
.titlebar {
  display: none;
}

/* ===== Sidebar (220px) ===== */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: #12161c;
  display: flex;
  flex-direction: column;
  padding: 20px 12px 12px;
  transition: background .3s;
}
[data-theme="light"] .sidebar { background: #f8f9fa; border-right: 1px solid var(--border); }

.sidebar-logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  padding: 4px 8px 2px;
  margin-bottom: 2px;
}
.sidebar-version {
  font-size: 11px;
  color: var(--text2);
  padding: 0 8px 16px;
}

/* Nav buttons */
.nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  margin-bottom: 2px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  color: var(--text2);
  border: none;
  background: transparent;
  font-family: var(--font);
  transition: all .15s;
  text-align: left;
  position: relative;
}
.nav-btn:hover { background: var(--hover); color: var(--text); }
.nav-btn.active { 
  background: var(--border); 
  color: var(--text);
  font-weight: 600;
}
.nav-btn.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 3px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.nav-btn .icon { font-size: 16px; width: 20px; text-align: center; }

.sidebar-spacer { flex: 1; }

/* Theme toggle in sidebar */
.theme-btn {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font);
  transition: all .15s;
}
.theme-btn:hover { background: var(--hover); color: var(--text); }

/* ===== Main Content ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* ===== Header ===== */
.header { margin-bottom: 20px; }
.header h2 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.header .subtitle {
  font-size: 13px;
  color: var(--text2);
}

/* ===== Stats Row ===== */
.stats-row {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  min-width: 0;
  transition: background .3s, border-color .3s;
}
.stat-card .label {
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 4px;
  font-weight: 600;
}
.stat-card .value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
}
.stat-card .value.accent { color: var(--accent); }

/* ===== Settings Card ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  transition: background .3s, border-color .3s;
}

.settings-grid {
  display: grid;
  grid-template-columns: auto 1fr auto 1fr;
  gap: 10px 16px;
  align-items: center;
}
.settings-grid .lbl {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

/* Input / Select */
input[type="text"], select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--font);
  transition: all .2s;
  width: 100%;
}
input[type="text"]:focus, select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(88,166,255,.15);
}
select { cursor: pointer; }

/* Checkbox */
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 16px;
  grid-column: 3 / 5;
}
.checkbox-row label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
}
.checkbox-row input[type="checkbox"] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}

/* ===== Buttons ===== */
.btn-row {
  display: flex;
  gap: 8px;
  grid-column: 3 / 5;
  justify-content: flex-end;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  transition: all .15s;
  white-space: nowrap;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }

.btn-fill {
  background: var(--accent);
  color: #fff;
}
.btn-fill:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-ghost:hover:not(:disabled) { background: var(--hover); }

.btn-danger {
  background: var(--danger);
  color: #fff;
}
.btn-danger:hover:not(:disabled) { background: var(--danger-hover); }

.btn-danger-ghost {
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
}
.btn-danger-ghost:hover:not(:disabled) { background: rgba(248,81,73,.1); }

.btn-sm { padding: 6px 12px; font-size: 12px; }

/* ===== Progress ===== */
.progress-section {
  display: none;
  margin-bottom: 16px;
}
.progress-section.visible { display: block; }

.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  width: 0%;
  transition: width .3s ease;
}
.progress-label {
  font-size: 12px;
  color: var(--text2);
}

/* ===== ListView ===== */
.listview {
  flex: 1;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  margin-bottom: 12px;
  min-height: 200px;
  max-height: 300px;
}
.listview-header {
  display: grid;
  grid-template-columns: 20px 3fr 80px 100px 2fr;
  gap: 0;
  padding: 10px 16px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .5px;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}
.listview-row {
  display: grid;
  grid-template-columns: 20px 3fr 80px 100px 2fr;
  gap: 0;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  align-items: center;
  cursor: pointer;
  transition: background .1s;
}
.listview-row:nth-child(odd) { background: var(--surface); }
.listview-row:nth-child(even) { background: var(--card); }
.listview-row:hover { background: rgba(88,166,255,.08); }
.listview-row .col2, .listview-row .col3 { text-align: center; color: var(--text2); }
.listview-row input[type="checkbox"] { accent-color: var(--accent); }

/* ===== Bottom Bar ===== */
.bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 8px;
}
.bottom-bar .summary {
  font-size: 13px;
  color: var(--text2);
}
.bottom-bar .actions {
  display: flex;
  gap: 8px;
}

/* ===== Interactive Demo ===== */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}
.badge-green { background: rgba(63,185,80,.15); color: var(--success); }
.badge-blue { background: rgba(88,166,255,.15); color: var(--accent); }
.badge-red { background: rgba(248,81,73,.15); color: var(--danger); }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 999;
}
.toast.show { opacity: 1; }

/* ===== Responsive fallback ===== */
@media (max-width: 950px) {
  .app-window { flex-direction: column; width: 100%; height: auto; }
  .sidebar { width: 100%; min-width: 100%; flex-direction: row; flex-wrap: wrap; gap: 4px; padding: 10px; }
  .sidebar-logo, .sidebar-version, .sidebar-spacer { display: none; }
  .nav-btn { flex: 1; justify-content: center; font-size: 12px; padding: 8px; }
  .nav-btn.active::before { display: none; }
  .settings-grid { grid-template-columns: 1fr 1fr; }
  .btn-row, .checkbox-row { grid-column: 1 / 3; }
}
</style>
</head>
<body>

<div class="app-window" id="app">
  <!-- ===== Sidebar ===== -->
  <div class="sidebar">
    <div class="sidebar-logo">CleanDub</div>
    <div class="sidebar-version">v0.3.0</div>
    
    <button class="nav-btn active" onclick="navTo(this, 0)">
      <span class="icon">🔍</span> 扫描
    </button>
    <button class="nav-btn" onclick="navTo(this, 1)">
      <span class="icon">📋</span> 历史
    </button>
    <button class="nav-btn" onclick="navTo(this, 2)">
      <span class="icon">📦</span> 隔离区
    </button>
    <button class="nav-btn" onclick="navTo(this, 3)">
      <span class="icon">⚙</span> 设置
    </button>

    <div class="sidebar-spacer"></div>
    
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙  深色模式</button>
  </div>

  <!-- ===== Main Content ===== -->
  <div class="main">
    <div class="main-scroll">
      <!-- Header -->
      <div class="header">
        <h2>重复文件清理</h2>
        <div class="subtitle">内容级 SHA-256 判重 · 安全隔离区 · 误删可还原</div>
      </div>

      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="label">重复组</div>
          <div class="value" id="statGroups">—</div>
        </div>
        <div class="stat-card">
          <div class="label">待处理</div>
          <div class="value" id="statVictims">—</div>
        </div>
        <div class="stat-card">
          <div class="label">可释放</div>
          <div class="value accent" id="statBytes">—</div>
        </div>
        <div class="stat-card">
          <div class="label">扫描耗时</div>
          <div class="value" id="statTime">—</div>
        </div>
      </div>

      <!-- Settings Card -->
      <div class="card">
        <div class="settings-grid">
          <span class="lbl">扫描目录</span>
          <div style="display:flex;gap:8px;">
            <input type="text" id="txtPath" value="C:UsersDocumentsWeChat Files" style="flex:1;">
            <button class="btn btn-ghost btn-sm" onclick="browse()">浏览…</button>
          </div>
          <span class="lbl">保留策略</span>
          <div style="display:flex;gap:8px;">
            <select id="cmbStrategy">
              <option>名字最干净 (Cleanest)</option>
              <option>修改时间最新 (Newest)</option>
              <option>无后缀原件 (Original)</option>
              <option>(N) 数字最大 (Highest)</option>

            <span class="lbl">校验级别</span>
            <select id="cmbVerify">
              <option>全量 SHA-256（最准确）</option>
              <option>头部 32KB（较快）</option>
              <option>仅文件名</option>
              <option>仅文件大小</option>
            </select>
          </div>

          <div class="checkbox-row">
            <label><input type="checkbox" id="chkRecurse" checked> 递归子目录</label>
            <label><input type="checkbox" id="chkLinks" checked> 检测硬链接</label>
          </div>

          <div class="btn-row">
            <button class="btn btn-fill" id="btnScan" onclick="startScan()">▶  开始扫描</button>
            <button class="btn btn-danger-ghost btn-sm" id="btnStop" disabled onclick="stopScan()">⏹  终止</button>
          </div>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-section" id="progressSection">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel">正在准备…</div>
      </div>

      <!-- Results ListView -->
      <div class="listview" id="listviewContainer">
        <div class="listview-header">
          <span></span>
          <span>目录</span>
          <span style="text-align:center">文件数</span>
          <span style="text-align:center">可释放</span>
          <span>保留文件</span>
        </div>
        <div id="listviewBody">
          <div class="listview-row" style="color:var(--text2);justify-content:center;display:flex;grid-column:1/-1;">
            <span>选择扫描目录后点击「开始扫描」</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar" style="padding: 0 24px;">
      <span class="summary" id="summaryText">选择扫描目录后点击「开始扫描」</span>
      <div class="actions">
        <button class="btn btn-fill btn-sm" id="btnQuarantine" disabled onclick="quarantine()">📦  移入隔离区</button>
        <button class="btn btn-ghost btn-sm" id="btnExport" disabled onclick="exportCsv()">📥  导出 CSV</button>
        <button class="btn btn-danger btn-sm" id="btnDelete" disabled onclick="confirmDelete()">🗑  永久删除</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== Theme =====
let dark = true;
function toggleTheme() {
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? null : 'light');
  document.getElementById('themeBtn').textContent = dark ? '🌙  深色模式' : '☀️  浅色模式';
}

// ===== Navigation =====
function navTo(btn, idx) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ===== Browse =====
function browse() {
  showToast('将打开文件夹选择对话框 (FolderBrowserDialog)');
}

// ===== Scan simulation =====
let scanTimer = null;
let scanProgress = 0;

function startScan() {
  const path = document.getElementById('txtPath').value.trim();
  if (!path) { showToast('请选择扫描目录'); return; }

  document.getElementById('btnScan').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('progressSection').classList.add('visible');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressLabel').textContent = '正在索引文件…';
  document.getElementById('listviewBody').innerHTML = '';
  document.getElementById('summaryText').textContent = '扫描中…';
  document.getElementById('btnQuarantine').disabled = true;
  document.getElementById('btnExport').disabled = true;
  document.getElementById('btnDelete').disabled = true;

  // Reset stats
  document.getElementById('statGroups').textContent = '…';
  document.getElementById('statVictims').textContent = '…';
  document.getElementById('statBytes').textContent = '…';
  document.getElementById('statTime').textContent = '…';

  scanProgress = 0;
  const phases = [
    { pct: 15, label: '正在索引文件…', ms: 600 },
    { pct: 35, label: '按大小分组… (22,572 组)', ms: 500 },
    { pct: 55, label: '头部预哈希 (32KB)…', ms: 700 },
    { pct: 85, label: '全量 SHA-256… (11,487 个)', ms: 1200 },
    { pct: 100, label: '扫描完成', ms: 400 },
  ];

  let idx = 0;
  function step() {
    if (idx >= phases.length) return;
    const p = phases[idx];
    document.getElementById('progressFill').style.width = p.pct + '%';
    document.getElementById('progressLabel').textContent = p.label;
    idx++;
    if (idx < phases.length) {
      scanTimer = setTimeout(step, p.ms);
    } else {
      // Done
      setTimeout(() => {
        document.getElementById('progressSection').classList.remove('visible');
        document.getElementById('btnScan').disabled = false;
        document.getElementById('btnStop').disabled = true;
        finishScanDemo();
      }, p.ms);
    }
  }
  step();
}

function stopScan() {
  if (scanTimer) clearTimeout(scanTimer);
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressLabel').textContent = '已取消';
  setTimeout(() => {
    document.getElementById('progressSection').classList.remove('visible');
    document.getElementById('btnScan').disabled = false;
    document.getElementById('btnStop').disabled = true;
  }, 600);
}

function finishScanDemo() {
  document.getElementById('statGroups').textContent = '12,385';
  document.getElementById('statVictims').textContent = '23,828';
  document.getElementById('statBytes').textContent = '10.56 GB';
  document.getElementById('statTime').textContent = '237s';

  const items = [
    { dir: '2020-03\楚雄州人民检察院…方案_H3C_1126.docx', count: '2', size: '12.8 MB', keeper: '方案_H3C_1126.docx', tag: 'dup' },
    { dir: '2020-11\楚雄州人民检察院…方案_H3C_1126.docx', count: '', size: '', keeper: '', tag: 'victim' },
    { dir: 'FileStorage\File\2019-03\', count: '3', size: '64.2 MB', keeper: '样音-13配(3).mp3', tag: 'dup' },
    { dir: 'FileStorage\File\2019-03\', count: '', size: '', keeper: '', tag: 'victim' },
    { dir: 'FileStorage\File\2019-03\', count: '', size: '', keeper: '', tag: 'victim' },
    { dir: 'Video\原始素材\090240afe63d…_raw.mp4', count: '2', size: '609 MB', keeper: '6d6104dd…_raw.mp4', tag: 'dup' },
    { dir: 'Video\原始素材\6d6104ddda92…_raw.mp4', count: '', size: '', keeper: '', tag: 'victim' },
    { dir: '2021-06\七中06电专业CAD.zip', count: '5', size: '45.1 MB', keeper: '七中06电专业CAD(4).zip', tag: 'dup' },
    { dir: '2021-06\七中06电专业CAD(2)(2).zip', count: '', size: '', keeper: '', tag: 'victim' },
    { dir: '2021-06\七中06电专业CAD(5)(2).zip', count: '', size: '', keeper: '', tag: 'victim' },
    { dir: '2021-06\七中06电专业CAD(4)(2).zip', count: '', size: '', keeper: '', tag: 'victim' },
    { dir: '2021-06\七中06电专业CAD(3)(2).zip', count: '', size: '', keeper: '', tag: 'victim' },
  ];

  let html = '';
  let totalSelected = 0;
  let totalBytes = 0;
  const byteMap = { '12.8 MB': 13421772, '64.2 MB': 67318579, '609 MB': 638582784, '45.1 MB': 47290777 };

  items.forEach((item, i) => {
    let cls = (i % 2 === 0) ? 'even' : 'odd';
    html += '<div class="listview-row">';
    html += '<span><input type="checkbox" checked onchange="updateSummary()"></span>';
    html += '<span>' + item.dir + '</span>';
    if (item.count) {
      html += '<span class="col2">' + item.count + '</span>';
      html += '<span class="col2">' + item.size + '</span>';
    } else {
      html += '<span class="col2">—</span><span class="col2">—</span>';
    }
    html += '<span>' + (item.keeper || (item.tag === 'victim' ? '待清理' : '')) + '</span>';
    html += '</div>';
  });

  document.getElementById('listviewBody').innerHTML = html;
  updateSummary();
  document.getElementById('btnQuarantine').disabled = false;
  document.getElementById('btnExport').disabled = false;
  document.getElementById('btnDelete').disabled = false;
}

function updateSummary() {
  const checks = document.querySelectorAll('#listviewBody input[type="checkbox"]');
  let count = 0;
  checks.forEach(c => { if (c.checked) count++; });
  document.getElementById('summaryText').textContent = '已勾选 ' + count + ' 个文件 · 预计释放 10.56 GB';
}

function quarantine() { showToast('将调用 dedup.ps1 -Action Quarantine -Yes'); }
function exportCsv() { showToast('将导出 plan.csv (SaveFileDialog)'); }

function confirmDelete() {
  if (confirm('永久删除将无法还原！

建议优先使用「移入隔离区」。

确定要永久删除吗？')) {
    showToast('⚠ 已确认永久删除（模拟）');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
