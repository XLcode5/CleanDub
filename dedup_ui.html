<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cleandup — 重复文件清理</title>
<style>
:root{--bg:#0f172a;--bg-card:#1e293b;--bg-hover:#334155;--border:#334155;--text:#f1f5f9;--text-secondary:#94a3b8;--accent:#3b82f6;--accent-hover:#2563eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 4px 6px -1px rgba(0,0,0,.3),0 2px 4px -2px rgba(0,0,0,.3)}
[data-theme="light"]{--bg:#f1f5f9;--bg-card:#fff;--bg-hover:#e2e8f0;--border:#cbd5e1;--text:#1e293b;--text-secondary:#64748b;--accent:#2563eb;--accent-hover:#1d4ed8;--shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.app{max-width:1200px;margin:0 auto;padding:24px 20px 100px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.header h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.header h1 svg{width:28px;height:28px}
.theme-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;transition:all .2s}
.theme-btn:hover{background:var(--bg-hover)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:end}
.control-group{display:flex;flex-direction:column;gap:6px}
.control-group label{font-size:13px;color:var(--text-secondary);font-weight:500}
.control-group input[type=text],.control-group select{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;transition:border-color .2s}
.control-group input[type=text]:focus,.control-group select:focus{outline:none;border-color:var(--accent)}
.control-group input[type=text]::placeholder{color:var(--text-secondary)}
.checkbox-group{display:flex;align-items:center;gap:8px;padding:10px 0}
.checkbox-group input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}.btn-primary:disabled{background:var(--text-secondary);cursor:not-allowed}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-ghost:hover{background:var(--bg-hover)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#059669}
.btn-browse{background:var(--bg-hover);color:var(--text);border:1px solid var(--border);padding:10px 16px;font-size:14px}.btn-browse:hover{background:var(--border)}
.btn-stop{background:var(--warning);color:#000}.btn-stop:hover{background:#d97706}
.progress-wrap{display:none;margin-top:16px}
.progress-bar{height:8px;background:var(--bg-hover);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:var(--accent);border-radius:4px;transition:width .3s ease}
.progress-text{font-size:13px;color:var(--text-secondary);margin-top:8px;display:flex;justify-content:space-between}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat-card .value{font-size:24px;font-weight:700;margin:4px 0}
.stat-card .label{font-size:12px;color:var(--text-secondary)}
.stat-card .sub{font-size:11px;color:var(--text-secondary);margin-top:4px}
.stat-card.highlight .value{color:var(--success)}
.stat-card.warning .value{color:var(--warning)}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:16px}
.filter-bar input[type=text]{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:14px}
.filter-bar select{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:14px}
.group-list{display:flex;flex-direction:column;gap:12px}
.group-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.group-header{background:var(--bg-hover);padding:12px 16px;font-size:13px;color:var(--text-secondary);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.group-header .dir{font-weight:500}
.group-header .badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.sortable-header{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;transition:color .2s}
.sortable-header:hover{color:var(--accent)}
.sortable-header .sort-icon{font-size:11px;opacity:.4;transition:opacity .2s}
.sortable-header.sort-asc .sort-icon{opacity:1;content:"▲"}
.sortable-header.sort-desc .sort-icon{opacity:1}
.file-row{display:grid;grid-template-columns:32px 1fr 140px 100px;gap:12px;padding:10px 16px;align-items:center;font-size:13px;border-bottom:1px solid var(--border);transition:background .2s}
.file-row:last-child{border-bottom:none}
.file-row:hover{background:var(--bg-hover)}
.file-row.keeper{background:rgba(16,185,129,.1)}
.file-row.keeper:hover{background:rgba(16,185,129,.15)}
.file-row .name{word-break:break-all;display:flex;align-items:center;gap:8px}
.file-row .name .tag{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600}
.file-row.keeper .name .tag{background:var(--success);color:#fff}
.file-row.victim .name .tag{background:var(--warning);color:#000}
.file-row .mtime{color:var(--text-secondary)}
.file-row .size{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)}
.file-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;padding:16px;font-size:14px;color:var(--text-secondary)}
.pagination button{background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;transition:all .2s}
.pagination button:hover:not(:disabled){background:var(--bg-hover)}
.pagination button:disabled{opacity:.5;cursor:not-allowed}
.action-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);padding:16px 20px;display:flex;gap:12px;align-items:center;box-shadow:0 -4px 6px -1px rgba(0,0,0,.1);z-index:100}
.action-bar .spacer{flex:1}
.action-bar .info{font-size:14px;color:var(--text-secondary)}
.quarantine-panel{display:none;margin-top:16px}
.quarantine-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:13px}
.quarantine-item .path{flex:1;word-break:break-all;color:var(--text-secondary)}
.quarantine-item .actions{display:flex;gap:8px}
.history-panel{display:none;margin-top:16px}
.history-item{display:grid;grid-template-columns:160px 110px 90px 110px 1fr;gap:12px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:13px;align-items:center}
.history-item .op-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--accent);color:#fff}
.history-item .op-tag.purge-permanent{background:var(--danger)}
.history-item .op-tag.restore{background:var(--success)}
.history-item .time{color:var(--text-secondary);font-variant-numeric:tabular-nums}
.history-item .num{font-variant-numeric:tabular-nums;color:var(--text-secondary)}
.history-item .detail{color:var(--text);word-break:break-all}
.history-empty{color:var(--text-secondary);text-align:center;padding:20px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:.5}
.empty-state p{font-size:16px;margin-bottom:8px}
.empty-state .sub{font-size:14px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:90%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 25px -5px rgba(0,0,0,.3)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer;padding:4px}
.modal-body{flex:1;overflow-y:auto;padding:12px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.dir-breadcrumb{padding:10px 16px;background:var(--bg);border-radius:8px;margin-bottom:12px;font-size:13px;color:var(--text-secondary);word-break:break-all}
.dir-list{display:flex;flex-direction:column;gap:4px}
.dir-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .2s;font-size:14px}
.dir-item:hover{background:var(--bg-hover)}
.dir-item svg{width:18px;height:18px;flex-shrink:0}
.dir-item .name{flex:1;word-break:break-all}
.dir-item .size{color:var(--text-secondary);font-size:12px}
.dir-item.parent{color:var(--accent)}
@media (max-width:768px){
  .controls{grid-template-columns:1fr}
  .file-row{grid-template-columns:32px 1fr 80px;gap:8px}
  .file-row .mtime{display:none}
  .action-bar{flex-wrap:wrap}
  .modal{width:95%;max-height:90vh}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>Cleandup</h1>
    <button class="theme-btn" onclick="toggleTheme()"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>深色模式</button>
  </div>

  <div class="card">
    <div class="card-title">扫描设置</div>
    <div class="controls">
      <div class="control-group" style="grid-column:1/-1">
        <label>扫描目录（支持多个，用分号分隔）</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="path" placeholder="D:\Downloads; E:\Photos" style="flex:1">
          <button class="btn btn-browse" id="browseBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>浏览…</button>
        </div>
      </div>
      <div class="control-group">
        <label>保留策略</label>
        <select id="strategy">
          <option value="Cleanest">名字最干净（(N) 最少）</option>
          <option value="Newest">修改时间最新</option>
          <option value="Original">无后缀原件优先</option>
          <option value="Highest">(N) 数字最大</option>
        </select>
      </div>
      <div class="control-group">
        <label>扫描方式</label>
        <select id="verify">
          <option value="Full">全量哈希（准确，较慢）</option>
          <option value="Head">只比头部（最快，可能误判）</option>
          <option value="Name">只比文件名（最快，跨目录同名命中）</option>
          <option value="Size">只比文件大小（最快，可能误判）</option>
        </select>
      </div>
      <div class="control-group">
        <label>预筛强度
          <span style="font-size:11px;color:var(--text-secondary);font-weight:normal" title="扫描前先读文件开头一小段做快速排除，不相同就直接跳过，不用读整个文件。强度越高预筛越准，但读取量越大。">（开头读多少做快速排除）</span>
        </label>
        <select id="headKB">
          <option value="16">低（16 KB，小文件多时用）</option>
          <option value="32" selected>中（32 KB，推荐平衡）</option>
          <option value="64">高（64 KB，大文件多时用）</option>
          <option value="128">最高（128 KB，视频等大文件）</option>
        </select>
      </div>
      <div class="control-group">
        <label>最小文件大小</label>
        <select id="minFileSize">
          <option value="1">不限</option>
          <option value="1024">≥ 1 KB</option>
          <option value="10240">≥ 10 KB</option>
          <option value="102400">≥ 100 KB</option>
          <option value="1048576">≥ 1 MB</option>
        </select>
      </div>
      <div class="checkbox-group"><input type="checkbox" id="recurse" checked><label for="recurse" style="margin:0">递归子目录</label></div>
      <div class="checkbox-group"><input type="checkbox" id="links" checked><label for="links" style="margin:0">检测硬链接</label></div>
      <div class="control-group" style="display:flex;flex-direction:row;gap:8px;align-items:flex-end">
        <button class="btn btn-primary" id="scanBtn" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>开始扫描</button>
        <button class="btn btn-stop" id="stopScanBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><rect x="6" y="6" width="12" height="12"/></svg>终止</button>
      </div>
    </div>
    <div class="progress-wrap" id="progWrap">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      <div class="progress-text"><span id="progPhase">等待中…</span><span id="progTime">0 秒</span></div>
    </div>
  </div>

  <div id="summary"></div>

  <div class="filter-bar">
    <input type="text" id="filter" placeholder="搜索目录或文件名…">
    <select id="filterExt">
      <option value="">全部类型</option>
      <option value=".jpg,.jpeg,.png,.gif,.bmp,.webp">图片</option>
      <option value=".mp4,.avi,.mkv,.mov,.wmv">视频</option>
      <option value=".mp3,.wav,.flac,.aac">音频</option>
      <option value=".doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf">文档</option>
      <option value=".zip,.rar,.7z,.tar,.gz">压缩包</option>
    </select>
    <select id="minGroupSize">
      <option value="0">不限大小</option>
      <option value="1024">≥ 1 MB</option>
      <option value="10240">≥ 10 MB</option>
      <option value="51200">≥ 50 MB</option>
      <option value="102400">≥ 100 MB</option>
    </select>
    <button class="btn btn-ghost" id="filterBtn">筛选</button>
    <button class="btn btn-ghost" id="clearFilterBtn">清除</button>
  </div>

  <div id="groups" class="group-list">
    <div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><p>尚未开始扫描</p><div class="sub">设置扫描目录后点击「开始扫描」</div></div>
  </div>

  <div class="pagination" id="pagination" style="display:none"><button id="prevBtn">上一页</button><span id="pageInfo">-</span><button id="nextBtn">下一页</button></div>

  <div class="card quarantine-panel" id="qPanel"><div class="card-title">隔离区管理</div><div id="qList"></div></div>

  <div class="card history-panel" id="hPanel"><div class="card-title">操作历史（最近的清理/还原记录）</div><div id="hList"></div></div>

  <div class="action-bar">
    <button class="btn btn-success" id="qBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M5 8l6 6 6-6"/></svg>移入隔离区</button>
    <button class="btn btn-danger" id="delBtn">永久删除</button>
    <div class="spacer"></div>
    <span class="info" id="selInfo">已勾选 0 个文件</span>
    <button class="btn btn-ghost" id="allBtn">全选</button>
    <button class="btn btn-ghost" id="noneBtn">全不选</button>
    <button class="btn btn-ghost" id="expBtn">导出 CSV</button>
    <button class="btn btn-ghost" id="expJsonBtn">导出 JSON</button>
    <button class="btn btn-ghost" id="qShowBtn">隔离区</button>
    <button class="btn btn-ghost" id="hShowBtn">历史</button>
    <button class="btn btn-ghost" id="stopBtn">关闭服务</button>
  </div>
</div>

<div class="modal-overlay" id="browseModal">
  <div class="modal">
    <div class="modal-header"><h3>选择扫描目录</h3><button class="modal-close" id="browseClose">&times;</button></div>
    <div class="modal-body"><div class="dir-breadcrumb" id="browsePath">加载中…</div><div class="dir-list" id="browseList"></div></div>
    <div class="modal-footer"><button class="btn btn-ghost" id="browseCancel">取消</button><button class="btn btn-primary" id="browseSelect">选择此目录</button></div>
  </div>
</div>

<script>
function toggleTheme(){var h=document.documentElement,b=document.querySelector('.theme-btn');if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg> 深色模式';localStorage.setItem('clearapp-theme','dark')}else{h.setAttribute('data-theme','light');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg> 浅色模式';localStorage.setItem('clearapp-theme','light')}}
(function(){var s=localStorage.getItem('clearapp-theme');if(s==='light'){document.documentElement.setAttribute('data-theme','light')}})();

var T="__TOKEN__";
var st={offset:0,limit:50,total:0,filter:"",minKB:0,filterExt:"",groups:[],summary:null,selectedNow:0,selectedBytes:0,polling:null,scanning:false,sortKey:null,sortDir:1};

function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(b){b=Number(b)||0;if(b>=1073741824)return(b/1073741824).toFixed(2)+" GB";if(b>=1048576)return(b/1048576).toFixed(2)+" MB";if(b>=1024)return(b/1024).toFixed(1)+" KB";return b+" B"}
function arr(x){if(x==null)return[];return Array.isArray(x)?x:[x]}

function api(path,method,body){var url=path+(path.indexOf("?")>=0?"&":"?")+"t="+T;var opt={method:method||"GET",headers:{}};if(body!==undefined){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}return fetch(url,opt).then(function(r){return r.json()})}

function renderSummary(){var s=st.summary;if(!s)return;var h='<div class="stats-grid">';
h+='<div class="stat-card"><div class="label">重复组</div><div class="value">'+s.totalGroups+'</div><div class="sub">扫描 '+s.scannedFiles+' 个文件</div></div>';
h+='<div class="stat-card"><div class="label">待清理文件</div><div class="value">'+s.totalVictims+'</div><div class="sub">已校验 '+(s.verifiedVictims||0)+' · 不一致 '+(s.differVictims||0)+'</div></div>';
h+='<div class="stat-card highlight"><div class="label">预计释放（勾选）</div><div class="value" id="selBytesV">'+fmt(st.selectedBytes||0)+'</div><div class="sub">已勾选 '+st.selectedNow+' 个文件</div></div>';
h+='<div class="stat-card"><div class="label">表面可释放</div><div class="value">'+fmt(s.nominalBytes)+'</div><div class="sub">全部待删项总和</div></div>';
h+='<div class="stat-card '+(s.sharedVictims?'warning':'highlight')+'"><div class="label">真实可释放</div><div class="value">'+fmt(s.realBytes)+'</div><div class="sub">'+(s.sharedVictims?(s.sharedVictims+' 个硬链接不释放空间'):'全部是独立文件')+'</div></div>';
h+='<div class="stat-card"><div class="label">扫描耗时</div><div class="value">'+(s.elapsedMs/1000).toFixed(1)+'s</div><div class="sub">'+s.strategy+' · '+s.verify+'</div></div>';h+="</div>";el("summary").innerHTML=h}

function rowHtml(f,isKeeper){var linkBadge=(f.links>1)?'<span style="font-size:11px;padding:2px 6px;border-radius:4px;background:var(--warning);color:#000;margin-left:6px">硬链接 '+f.links+'</span>':"";
if(isKeeper){return '<div class="file-row keeper"><span></span><span class="name"><span class="tag">保留</span>'+esc(f.name)+'</span><span class="mtime">'+esc(f.mtime)+'</span><span class="size">'+fmt(f.size)+'</span></div>'}
return '<div class="file-row victim"><span><input type="checkbox" class="pick" data-path="'+esc(f.path)+'"'+(f.selected?" checked":"")+'></span><span class="name"><span class="tag">删除</span>'+esc(f.name)+linkBadge+'</span><span class="mtime">'+esc(f.mtime)+'</span><span class="size">'+fmt(f.size)+'</span></div>'}

function groupSize(g){var s=0;var vs=arr(g.victims);for(var i=0;i<vs.length;i++)s+=Number(vs[i].size)||0;if(g.keeper)s+=Number(g.keeper.size)||0;return s}
function sortGroups(list){if(!st.sortKey)return list;var sorted=list.slice();sorted.sort(function(a,b){var va,vb;if(st.sortKey==='dir'){va=(a.dir||'').toLowerCase();vb=(b.dir||'').toLowerCase()}else if(st.sortKey==='size'){va=groupSize(a);vb=groupSize(b)}else if(st.sortKey==='count'){va=arr(a.victims).length;vb=arr(b.victims).length}else{return 0}if(va<vb)return -1*st.sortDir;if(va>vb)return 1*st.sortDir;return 0});return sorted}
function toggleSort(key){if(st.sortKey===key){st.sortDir=-st.sortDir}else{st.sortKey=key;st.sortDir=1}renderPage(st.groups)}

function renderPage(groups){st.groups=arr(groups);var box=el("groups");
if(st.groups.length===0){box.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><p>没有找到重复文件</p><div class="sub">尝试调整筛选条件或扫描其他目录</div></div>';el("pagination").style.display="none";return}
var sorted=sortGroups(st.groups);
var h='<div class="group-item"><div class="group-header" style="padding:8px 16px"><span class="sortable-header '+(st.sortKey==='dir'?('sort-'+(st.sortDir>0?'asc':'desc')):'')+'" data-sort="dir">目录<span class="sort-icon">'+(st.sortKey==='dir'?(st.sortDir>0?'▲':'▼'):'⇅')+'</span></span><span style="display:flex;gap:24px"><span class="sortable-header '+(st.sortKey==='size'?('sort-'+(st.sortDir>0?'asc':'desc')):'')+'" data-sort="size">大小<span class="sort-icon">'+(st.sortKey==='size'?(st.sortDir>0?'▲':'▼'):'⇅')+'</span></span><span class="sortable-header '+(st.sortKey==='count'?('sort-'+(st.sortDir>0?'asc':'desc')):'')+'" data-sort="count">数量<span class="sort-icon">'+(st.sortKey==='count'?(st.sortDir>0?'▲':'▼'):'⇅')+'</span></span></span></div></div>';
for(var i=0;i<sorted.length;i++){var g=sorted[i];h+='<div class="group-item"><div class="group-header"><span class="dir">['+(st.offset+i+1)+'] '+esc(g.dir)+'</span><span class="badge">'+g.victims.length+' 个副本</span></div>';h+=rowHtml(g.keeper,true);var vs=arr(g.victims);for(var j=0;j<vs.length;j++)h+=rowHtml(vs[j],false);h+="</div>"}box.innerHTML=h;el("pagination").style.display="flex";
var cbs=box.querySelectorAll("input.pick");for(var k=0;k<cbs.length;k++){cbs[k].addEventListener("change",function(){var p=this.getAttribute("data-path");var checked=this.checked;api("/api/select","POST",{paths:[p],selected:checked}).then(function(d){if(d.ok){st.selectedNow=d.selectedNow;st.selectedBytes=(d.selectedBytes||st.selectedBytes);updateSel()}})})}
var shs=box.querySelectorAll(".sortable-header");for(var m=0;m<shs.length;m++){shs[m].addEventListener("click",function(){toggleSort(this.getAttribute("data-sort"))})}
var pages=Math.max(1,Math.ceil(st.total/st.limit));var cur=Math.floor(st.offset/st.limit)+1;el("pageInfo").textContent="第 "+cur+" / "+pages+" 页，共 "+st.total+" 组";el("prevBtn").disabled=st.offset<=0;el("nextBtn").disabled=(st.offset+st.limit)>=st.total}

function updateSel(){el("selInfo").textContent="已勾选 "+st.selectedNow+" 个文件";var sv=el("selBytesV");if(sv)sv.textContent=fmt(st.selectedBytes||0)}

function loadPage(offset){st.offset=offset;var q="/api/page?offset="+offset+"&limit="+st.limit+"&filter="+encodeURIComponent(st.filter)+"&minKB="+st.minKB;if(st.filterExt){q+="&ext="+encodeURIComponent(st.filterExt)}api(q).then(function(d){if(!d.ok){console.error(d.error);return}st.total=d.total;st.selectedNow=d.selectedNow;st.selectedBytes=d.selectedBytes||0;renderPage(d.groups);updateSel()})}

function showProgress(p){el("progWrap").style.display="block";var pct=Number(p.percent)||0;el("progFill").style.width=pct+"%";var phaseText={indexing:"索引目录",scanning:"扫描中",done:"完成",error:"出错",idle:"等待"}[p.phase]||p.phase;el("progPhase").textContent=phaseText+" · "+(p.message||"");el("progTime").textContent=(p.elapsedSec||0)+" 秒";if(p.phase==="done"){el("progFill").style.background="var(--success)"}else if(p.phase==="error"){el("progFill").style.background="var(--danger)"}else{el("progFill").style.background="var(--accent)"}}

function pollProgress(){api("/api/progress").then(function(d){if(!d.ok)return;showProgress(d.progress);if(d.busy){st.polling=setTimeout(pollProgress,800)}else{st.scanning=false;el("scanBtn").style.display="inline-flex";el("stopScanBtn").style.display="none";if(d.progress&&d.progress.phase==="done"){loadPage(0)}}})}

function startScan(){st.scanning=true;el("scanBtn").style.display="none";el("stopScanBtn").style.display="inline-flex";el("progFill").style.width="0%";
api("/api/scan","POST",{path:el("path").value,recurse:el("recurse").checked,strategy:el("strategy").value,verify:el("verify").value,headKB:Number(el("headKB").value),detectLinks:el("links").checked,minFileSize:Number(el("minFileSize").value)}).then(function(d){if(!d.ok){alert("扫描失败: "+d.error);st.scanning=false;el("scanBtn").style.display="inline-flex";el("stopScanBtn").style.display="none";return}
el("summary").innerHTML="";el("groups").innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><p>正在扫描…</p></div>';pollProgress()})}

function stopScan(){if(!confirm("确定要终止当前扫描吗？已扫描的进度会丢失。"))return;api("/api/stop-scan","POST",{}).then(function(d){if(d.ok){st.scanning=false;el("scanBtn").style.display="inline-flex";el("stopScanBtn").style.display="none";el("progPhase").textContent="已终止";el("progFill").style.background="var(--warning)"}})}

function loadQuarantine(){api("/api/quarantine").then(function(d){if(!d.ok)return;el("qPanel").style.display="block";if(!d.sessions||d.sessions.length===0){el("qList").innerHTML='<div style="color:var(--text-secondary);text-align:center;padding:20px">隔离区为空</div>';return}
var h="";for(var i=0;i<d.sessions.length;i++){var s=d.sessions[i];h+='<div class="quarantine-item"><span class="path">'+esc(s.name)+' · '+s.files+' 个 · '+fmt(s.bytes)+'</span><div class="actions"><button class="btn btn-ghost" data-restore="'+esc(s.path)+'">还原</button><button class="btn btn-danger" data-purge="'+esc(s.path)+'">清空</button></div></div>'}
el("qList").innerHTML=h;var rs=el("qList").querySelectorAll("button[data-restore]");for(var k=0;k<rs.length;k++)rs[k].addEventListener("click",function(){api("/api/restore","POST",{session:this.getAttribute("data-restore")}).then(function(){loadQuarantine();loadPage(0);refreshHistoryIfOpen()})});
var ps=el("qList").querySelectorAll("button[data-purge]");for(var m=0;m<ps.length;m++)ps[m].addEventListener("click",function(){if(!confirm("永久删除这些隔离文件？不可恢复！"))return;api("/api/purge","POST",{session:this.getAttribute("data-purge")}).then(function(){loadQuarantine();refreshHistoryIfOpen()})})})}

var browseCurrentDir='';
function openBrowseModal(){el('browseModal').classList.add('active');var current=el('path').value.split(';')[0].trim()||'';loadBrowse(current)}
function loadBrowse(dir){api('/api/browse?dir='+encodeURIComponent(dir)).then(function(d){if(!d.ok){el('browsePath').textContent='错误：'+d.error;return}browseCurrentDir=d.current;el('browsePath').textContent=d.current;var h='';for(var i=0;i<d.items.length;i++){var item=d.items[i];var icon=item.isDir?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>';var cls=item.isParent?'dir-item parent':'dir-item';var sizeText=item.isDir?'':fmt(item.size);h+='<div class="'+cls+'" data-path="'+esc(item.path)+'" data-isdir="'+String(item.isDir)+'">'+icon+'<span class="name">'+esc(item.name)+'</span><span class="size">'+sizeText+'</span></div>'}
el('browseList').innerHTML=h||'<div style="color:var(--text-secondary);text-align:center;padding:20px">空目录</div>';var items=el('browseList').querySelectorAll('.dir-item');for(var j=0;j<items.length;j++){items[j].addEventListener('click',function(e){e.stopPropagation();var p=this.getAttribute('data-path');var isDir=this.getAttribute('data-isdir')==='true';if(isDir){loadBrowse(p)}else{selectBrowseDir(p)}});items[j].addEventListener('dblclick',function(e){e.stopPropagation();var p=this.getAttribute('data-path');var isDir=this.getAttribute('data-isdir')==='true';if(isDir){selectBrowseDir(p)}})}})}
function selectBrowseDir(dir){var current=el('path').value.trim();if(current&&!current.endsWith(';')){current+='; '}el('path').value=current+dir;el('browseModal').classList.remove('active')}

el('browseBtn').addEventListener('click',openBrowseModal);
el('browseClose').addEventListener('click',function(){el('browseModal').classList.remove('active')});
el('browseCancel').addEventListener('click',function(){el('browseModal').classList.remove('active')});
el('browseSelect').addEventListener('click',function(){selectBrowseDir(browseCurrentDir)});
el('browseModal').addEventListener('click',function(e){if(e.target===this){el('browseModal').classList.remove('active')}});

el("scanBtn").addEventListener("click",startScan);
el("stopScanBtn").addEventListener("click",stopScan);
el("prevBtn").addEventListener("click",function(){loadPage(Math.max(0,st.offset-st.limit))});
el("nextBtn").addEventListener("click",function(){loadPage(st.offset+st.limit)});
function applyFilters(){st.filter=el("filter").value;st.minKB=Number(el("minGroupSize").value)||0;st.filterExt=el("filterExt").value;loadPage(0)}
el("filterBtn").addEventListener("click",applyFilters);
el("clearFilterBtn").addEventListener("click",function(){el("filter").value="";st.filter="";el("minGroupSize").value="0";st.minKB=0;el("filterExt").value="";st.filterExt="";loadPage(0)});
el("filter").addEventListener("keydown",function(e){if(e.key==="Enter"){applyFilters()}});
el("allBtn").addEventListener("click",function(){api("/api/select","POST",{mode:"all"}).then(function(d){if(d.ok){st.selectedNow=d.selectedNow;loadPage(st.offset)}})});
el("noneBtn").addEventListener("click",function(){api("/api/select","POST",{mode:"none"}).then(function(d){if(d.ok){st.selectedNow=d.selectedNow;loadPage(st.offset)}})});
el("qBtn").addEventListener("click",function(){if(!confirm("把勾选的文件移入隔离区？（可一键还原）"))return;api("/api/quarantine","POST",{paths:[]}).then(function(d){if(!d.ok){alert("失败: "+d.error);return}st.selectedNow=d.selectedNow;updateSel();loadPage(st.offset);refreshHistoryIfOpen()})});
el("delBtn").addEventListener("click",function(){if(!confirm("永久删除勾选的文件？不可恢复！建议改用「移入隔离区」。"))return;if(!confirm("再次确认：真的要永久删除吗？"))return;api("/api/delete","POST",{confirm:true,paths:[]}).then(function(d){if(!d.ok){alert("失败: "+d.error);return}st.selectedNow=d.selectedNow;updateSel();loadPage(st.offset);refreshHistoryIfOpen()})});
el("expBtn").addEventListener("click",function(){window.location="/api/export?t="+T});
el("expJsonBtn").addEventListener("click",function(){window.location="/api/export-json?t="+T});
el("qShowBtn").addEventListener("click",loadQuarantine);

function opLabel(op){var m={quarantine:"隔离",purge:"清空隔离","purge-permanent":"永久删除",restore:"还原",scan:"扫描"};return m[op]||op||"操作"}
function fmtTs(ts){if(!ts)return"";return String(ts).replace("T"," ").substring(0,19)}
function loadHistory(){api("/api/history?limit=100").then(function(d){if(!d.ok){el("hList").innerHTML='<div class="history-empty">加载失败：'+esc(d.error||"未知错误")+'</div>';return}
if(!d.items||d.items.length===0){el("hList").innerHTML='<div class="history-empty">暂无操作记录</div>';return}
var h="";for(var i=0;i<d.items.length;i++){var it=d.items[i];var opCls=esc(it.op||"");var failNote=(it.failed>0)?' <span style="color:var(--danger)">失败 '+it.failed+'</span>':"";
h+='<div class="history-item"><span><span class="op-tag '+opCls+'">'+esc(opLabel(it.op))+'</span></span><span class="time">'+esc(fmtTs(it.ts))+'</span><span class="num">'+fmt(it.bytes||0)+'</span><span class="num">'+(it.files||0)+' 个文件'+failNote+'</span><span class="detail">'+esc(it.detail||"")+'</span></div>'}
el("hList").innerHTML=h})}
function toggleHistory(){var p=el("hPanel");if(p.style.display==="block"){p.style.display="none"}else{p.style.display="block";loadHistory()}}
el("hShowBtn").addEventListener("click",toggleHistory);
function refreshHistoryIfOpen(){var p=el("hPanel");if(p&&p.style.display==="block"){loadHistory()}}
el("stopBtn").addEventListener("click",function(){if(confirm("关闭本地服务？"))api("/api/stop").then(function(){document.body.innerHTML="<div style='padding:60px;text-align:center;font-size:18px;color:var(--text-secondary)'>服务已停止，可以关闭此页面。</div>"})});

api("/api/config").then(function(c){if(!c.ok)return;el("path").value=c.basePath||"";if(c.strategy)el("strategy").value=c.strategy;if(c.verify)el("verify").value=c.verify;if(c.headKB)el("headKB").value=String(c.headKB);if(c.detectLinks===false)el("links").checked=false;showProgress({phase:"idle",message:"空闲",elapsedSec:0,percent:0})});
</script>
</body>
</html>
